name: Tag Release

# Creates an immutable semver tag on every push to main that modifies
# reusable workflow or composite action files.
#
# Bump rules (Angular Conventional Commits):
#   BREAKING CHANGE in footer, or type!: in subject  →  major  (v1.2.3 → v2.0.0)
#   feat: or feat(scope):                            →  minor  (v1.2.3 → v1.3.0)
#   anything else (fix:, chore:, ci:, …)             →  patch  (v1.2.3 → v1.2.4)
#
# Callers must pin to the full immutable tag (e.g. @v1.0.0) and rely on
# Dependabot to receive updates. No mutable major alias is maintained.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calculate next version without pushing tags or creating a release'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - .github/workflows/terraform-stack.yml
      - .github/workflows/terraform-required-check.yml
      - .github/workflows/scheduled-tag-release.yml

concurrency:
  group: tag-release
  cancel-in-progress: false   # never cancel; runs execute one at a time

jobs:
  tag:
    name: Create semver tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          search_commit_body: true
          version_format: "${major}.${minor}.${patch}"

      - name: Push immutable tag
        if: steps.version.outputs.is_tagged != 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW="${{ steps.version.outputs.version_tag }}"
          git tag "$NEW" "${{ github.sha }}"
          git push origin "$NEW"
          echo "Tagged ${{ github.sha }} as $NEW"

      - name: Create GitHub Release
        if: steps.version.outputs.is_tagged != 'true' && !inputs.dry_run
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.version.outputs.version_tag }}
          name: ${{ steps.version.outputs.version_tag }}
          generateReleaseNotes: true
          makeLatest: true

      - name: Job summary
        if: always()
        run: |
          DRY_RUN="${{ inputs.dry_run || false }}"
          IS_TAGGED="${{ steps.version.outputs.is_tagged }}"
          NEW="${{ steps.version.outputs.version_tag }}"
          PREV="${{ steps.version.outputs.previous_version }}"
          TYPE="${{ steps.version.outputs.version_type }}"
          {
            if [[ "$IS_TAGGED" == "true" ]]; then
              echo "## 🏷️ Already tagged — $NEW"
              echo ""
              echo "> Commit is already tagged; no new tag was created."
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "## 🏷️ Dry Run — would release $NEW"
              echo ""
              echo "> No tags or GitHub Release were created."
            else
              echo "## 🏷️ Release $NEW"
            fi
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **New tag** | \`$NEW\` |"
            echo "| **Previous** | \`$PREV\` |"
            echo "| **Bump type** | \`$TYPE\` |"
            echo "| **Dry run** | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"
